<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Pixel Pantry{% endblock %}</title>
<meta name="theme-color" content="#5a3414">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="hearth" data-sprite="hearth"></span><span class="brandname">Pixel Pantry</span></a>
  <nav class="topnav">{% block topright %}{% endblock %}<a class="btn small basket" href="/list"><span class="bsk" data-sprite="basket"></span> Basket{% if basket_count() %} <b>{{ basket_count() }}</b>{% endif %}</a></nav>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
<footer class="foot"><span class="cat" data-sprite="cat"></span> No ads. No life stories. Just the recipe.</footer>
<script src="/static/pixel.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
